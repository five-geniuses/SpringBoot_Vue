<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>支付结果</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f7fa;
        }
        .container {
            max-width: 600px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,0.1);
            text-align: center;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .success {
            color: #67c23a;
        }
        .error {
            color: #f56c6c;
        }
        .title {
            font-size: 24px;
            color: #303133;
            margin-bottom: 20px;
        }
        .info {
            color: #606266;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <div v-if="paymentSuccess">
                <i class="el-icon-success icon success"></i>
                <h2 class="title">支付成功</h2>
                <p class="info">
                    您的订单已支付成功！<br>
                    订单号：{{ orderNo }}<br>
                    支付金额：¥{{ amount }}
                </p>
            </div>
            <div v-else>
                <i class="el-icon-error icon error"></i>
                <h2 class="title">支付失败</h2>
                <p class="info">
                    抱歉，支付过程中出现了问题。<br>
                    您可以返回订单中心重新尝试支付。
                </p>
            </div>
            <div class="button-group">
                <el-button type="primary" @click="goToOrders">查看订单</el-button>
                <el-button @click="goToHome">返回首页</el-button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus"></script>
    <script>
        const { createApp, ref } = Vue
        const app = createApp({
            setup() {
                const urlParams = new URLSearchParams(window.location.search)
                const paymentSuccess = ref(urlParams.get('trade_status') === 'TRADE_SUCCESS')
                const orderNo = ref(urlParams.get('out_trade_no') || '-')
                const amount = ref(urlParams.get('total_amount') || '0.00')

                const goToOrders = () => {
                    window.location.href = '/user/orders'
                }

                const goToHome = () => {
                    window.location.href = '/'
                }

                return {
                    paymentSuccess,
                    orderNo,
                    amount,
                    goToOrders,
                    goToHome
                }
            }
        })
        app.use(ElementPlus)
        app.mount('#app')
    </script>
</body>
</html>
