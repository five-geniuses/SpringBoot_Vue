<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>支付结果</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14"></script>
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        .result-container {
            width: 100%;
            max-width: 600px;
            margin: 100px auto;
            text-align: center;
        }
        .result-icon {
            font-size: 72px;
            margin-bottom: 20px;
        }
        .result-title {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .result-info {
            color: #666;
            margin-bottom: 30px;
        }
        .result-actions {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="result-container">
            <template v-if="loading">
                <el-card>
                    <div class="result-icon">
                        <i class="el-icon-loading"></i>
                    </div>
                    <div class="result-title">正在查询支付结果...</div>
                </el-card>
            </template>
            <template v-else>
                <el-card>
                    <div v-if="paySuccess" class="result-icon" style="color: #67C23A;">
                        <i class="el-icon-success"></i>
                    </div>
                    <div v-else class="result-icon" style="color: #F56C6C;">
                        <i class="el-icon-error"></i>
                    </div>
                    
                    <div class="result-title">
                        {{ paySuccess ? '支付成功' : '支付失败' }}
                    </div>
                    
                    <div class="result-info">
                        <p>订单号：{{ orderNo }}</p>
                        <p v-if="paySuccess">支付时间：{{ payTime }}</p>
                    </div>
                    
                    <div class="result-actions">
                        <el-button type="primary" @click="goToOrderList">返回订单列表</el-button>
                        <el-button v-if="!paySuccess" @click="retryPayment">重新支付</el-button>
                    </div>
                </el-card>
            </template>
        </div>
    </div>

    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    loading: true,
                    paySuccess: false,
                    orderNo: '',
                    payTime: '',
                    maxRetries: 3,
                    currentRetry: 0,
                    checkInterval: null
                }
            },
            created() {
                this.orderNo = this.getUrlParam('out_trade_no');
                if (this.orderNo) {
                    this.startCheckingPaymentStatus();
                } else {
                    this.loading = false;
                }
            },
            beforeDestroy() {
                if (this.checkInterval) {
                    clearInterval(this.checkInterval);
                }
            },
            methods: {
                getUrlParam(name) {
                    const urlParams = new URLSearchParams(window.location.search);
                    return urlParams.get(name);
                },
                startCheckingPaymentStatus() {
                    // 立即检查一次
                    this.checkPaymentStatus();
                    
                    // 设置定时检查，每3秒检查一次，最多检查3次
                    this.checkInterval = setInterval(() => {
                        this.currentRetry++;
                        if (this.currentRetry >= this.maxRetries) {
                            clearInterval(this.checkInterval);
                            this.loading = false;
                        } else {
                            this.checkPaymentStatus();
                        }
                    }, 3000);
                },
                checkPaymentStatus() {
                    axios.get(`/api/pay/status/${this.orderNo}`)
                        .then(response => {
                            if (response.data.code === 200) {
                                const payState = response.data.data.payState;
                                if (payState === 1) {
                                    this.paySuccess = true;
                                    this.payTime = response.data.data.payTime;
                                    clearInterval(this.checkInterval);
                                    this.loading = false;
                                }
                            }
                        })
                        .catch(() => {
                            clearInterval(this.checkInterval);
                            this.loading = false;
                        });
                },
                goToOrderList() {
                    window.location.href = '/orderTest.html';
                },
                retryPayment() {
                    window.location.href = `/orderTest.html?retry_order=${this.orderNo}`;
                }
            }
        });
    </script>
</body>
</html>
